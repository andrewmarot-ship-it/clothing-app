name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production server starts
        run: |
          PORT=3999 node server/index.ts &
          for i in $(seq 1 20); do curl -fsS localhost:3999/healthz && exit 0; sleep 0.5; done
          exit 1
