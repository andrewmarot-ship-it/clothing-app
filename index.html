<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efeee9" />
    <script>
      // Set the theme before first paint, so dark mode doesn't flash light (see src/state/theme.ts).
      try {
        var p = localStorage.getItem('clothesline-theme-v1') || 'light'
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161826')
      } catch (e) {}
    </script>
    <meta name="description" content="Clothesline: a virtual wardrobe that matches outfits to your colour tone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Clothesline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
